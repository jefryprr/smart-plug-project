metadata:
  title: PZEM Metering Harness (REV_C, internal isolation)
  description: 'PZEM 5 V/GND from PSU OUT3 (J7). PZEM TX/RX go to carrier J2; the divider and 74HCT125 are on the carrier. PZEM internal optocouplers are the only UART barrier (ADR-016). OUT3 is conditional on batch inspection and hipot/leakage.'
  author: OpenCode
  date: '2026-11-16'
  rev: REV_C_PSU_BOARD
options:
  bgcolor: WH
connectors:
  CT1:
    type: CT, 100 A, closed or split
    pinlabels: [CT_P, CT_N]
  U2:
    type: PZEM-004T V4 (internal optocoupler isolation)
    pinlabels: [L, N, CT_P, CT_N, +5V, GND, TX, RX]
  PSU_J7:
    type: PSU 5 V OUT3 (PZEM, conditional)
    pinlabels: [+5V, GND]
  J2:
    type: Carrier PZEM TTL connector (JST-XH 4)
    pinlabels: [NC, PZEM_RX_5V, PZEM_TX_5V, NC]
cables:
  W_CT:
    gauge: 0.25 mm2
    length: 0.20 m
    wirecount: 2
    color: GY
    colors: [WH, BK]
  W_PZEM_5V:
    gauge: 0.25 mm2
    length: 0.20 m
    wirecount: 2
    color: GY
    colors: [RD, BK]
  W_TTL:
    gauge: 0.25 mm2
    length: 0.20 m
    wirecount: 2
    color: GY
    colors: [WH, GN]
connections:
  - [CT1: [CT_P, CT_N], W_CT: [1, 2], U2: [CT_P, CT_N]]
  - [PSU_J7: [+5V, GND], W_PZEM_5V: [1, 2], U2: [+5V, GND]]
  - [U2: TX, W_TTL: [1], J2: PZEM_TX_5V]
  - [U2: RX, W_TTL: [2], J2: PZEM_RX_5V]
