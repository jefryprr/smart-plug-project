metadata:
  title: PZEM Metering Harness (REV_B, internal isolation)
  description: 'PZEM-004T V4 5 V TTL harness to carrier J2. The 10k/20k divider and 74HCT125 are on the carrier, not in this cable. PZEM internal optocouplers are the mains barrier.'
  author: OpenCode
  date: '2026-11-16'
  rev: REV_B_NO_TEMP
options:
  bgcolor: WH
connectors:
  CT1:
    type: CT, 100 A, closed or split
    pinlabels: [CT_P, CT_N]
  U2:
    type: PZEM-004T V4 (internal optocoupler isolation)
    pinlabels: [L, N, CT_P, CT_N, +5V, GND, TX, RX]
  J2:
    type: Carrier PZEM connector (JST-XH 4)
    pinlabels: [+5V, PZEM_RX_5V, PZEM_TX_5V, GND]
cables:
  W_CT:
    gauge: 0.25 mm2
    length: 0.20 m
    wirecount: 2
    color: GY
    colors: [WH, BK]
  W_PZEM:
    gauge: 0.25 mm2
    length: 0.20 m
    wirecount: 4
    color: GY
    colors: [RD, BK, WH, GN]
connections:
  - [CT1: [CT_P, CT_N], W_CT: [1, 2], U2: [CT_P, CT_N]]
  - [J2: [+5V, GND], W_PZEM: [1, 2], U2: [+5V, GND]]
  - [U2: TX, W_PZEM: [3], J2: PZEM_TX_5V]
  - [U2: RX, W_PZEM: [4], J2: PZEM_RX_5V]
