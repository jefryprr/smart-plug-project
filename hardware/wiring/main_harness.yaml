    length: 0.12 m
    color: GY
    wirelabels:
    - +5V_B
    - GND_B
    wirecount: 2
    colors:
    - RD
    - BK
  WPZEM_L:
    gauge: 0.5 mm2
    length: 0.20 m
    color: BN
    wirelabels:
    - PZEM_L
    wirecount: 1
  WPZEM_N:
    gauge: 0.5 mm2
    length: 0.20 m
    color: BU
    wirelabels:
    - PZEM_N
    wirecount: 1
  WCT:
    gauge: 0.25 mm2
    length: 0.20 m
    color: GY
    wirelabels:
    - CT_P
    - CT_N
    notes: Shielded/twisted; route away from relay.
    wirecount: 2
    colors:
    - WH
    - BK
  WISO_OUT:
    gauge: 0.5 mm2
    length: 0.15 m
    color: GY
    wirelabels:
    - +5V_ISO
    - GND_ISO
    wirecount: 2
    colors:
    - RD
    - BK
  WISO_PZEM:
    gauge: 0.5 mm2
    length: 0.15 m
    color: GY
    wirelabels:
    - +5V_ISO_PZEM
    - GND_ISO_PZEM
    wirecount: 2
    colors:
    - RD
    - BK
  WISO_U6:
    gauge: 0.25 mm2
    length: 0.12 m
    color: GY
    wirelabels:
    - +5V_ISO_U6
    - GND_ISO_U6
    wirecount: 2
    colors:
    - RD
    - BK
  WUART_PZEM:
    gauge: 0.25 mm2
    length: 0.15 m
    color: GY
    wirelabels:
    - PZEM_TX
    - PZEM_RX
    notes: PZEM side only; do not cross barrier.
    wirecount: 2
    colors:
    - WH
    - BK
  WUART_SELV:
    gauge: 0.25 mm2
    length: 0.15 m
    color: GY
    wirelabels:
    - ISO_TX
    - ISO_RX
    wirecount: 2
    colors:
    - WH
    - BK
  W_RELAY_MODULE:
    gauge: 0.5 mm2
    length: 0.25 m
    wirecount: 4
    color: GY
    colors:
    - RD
    - BK
    - OG
    - GY
    wirelabels:
    - +5V
    - GND
    - IN1
    - IN2
    notes: To off-board 2-channel relay module. Keep in mains zone; do not route over
      SELV logic.
