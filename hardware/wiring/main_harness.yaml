metadata:
  title: Smart Plug Main Harness (REV_B)
  description: 'Mains/relay/PSU/5V distribution. Qualified engineer review only. PE is never switched or fused. PZEM TTL is in metering_harness.yaml. J8 is the carrier 5 V input; J3 is the carrier relay connector.'
  author: OpenCode - digital engineering
  date: '2026-11-16'
  rev: REV_B_NO_TEMP
options:
  fontname: Arial
  bgcolor: WH
connectors:
  P1:
    type: Type F plug (mains input, 16 A class)
    pinlabels: [L, N, PE]
  F1:
    type: Fuse holder + 10 A time-lag ceramic fuse
    pinlabels: [IN, OUT]
  MOV1:
    type: MOV 275 VAC (10D271K / S10K275)
    pinlabels: [L, N]
  TF1:
    type: One-shot thermal cutoff 99 C, 10 A
    pinlabels: [IN, OUT]
  K1:
    type: 2-channel 5 V optocoupler relay module (off-board, active-LOW)
    pinlabels: [IN1, IN2, VCC, GND, COM1, NO1, COM2, NO2]
  X1:
    type: Type F socket output (16 A class)
    pinlabels: [L, N, PE]
  PS1:
    type: Hi-Link HLK-5M05 (5 V 1 A, 5 W, 4-pin)
    pinlabels: [AC_L, AC_N, +5V, 0V]
  J8:
    type: Carrier 5 V input (JST-XH 2)
    pinlabels: [+5V, GND]
  J3:
    type: Carrier relay connector (JST-XH 4)
    pinlabels: [+5V, GND, RELAY_IN1, RELAY_IN2]
cables:
  WL:
    gauge: 1.5 mm2
    length: 0.15 m
    wirecount: 1
    color: BN
  WL2:
    gauge: 1.5 mm2
    length: 0.15 m
    wirecount: 1
    color: BN
  WN:
    gauge: 1.5 mm2
    length: 0.15 m
    wirecount: 1
    color: BU
  WPE:
    gauge: 1.5 mm2
    length: 0.15 m
    wirecount: 1
    color: GNYE
  WPSU_L:
    gauge: 0.5 mm2
    length: 0.15 m
    wirecount: 1
    color: BN
  WPSU_N:
    gauge: 0.5 mm2
    length: 0.15 m
    wirecount: 1
    color: BU
  WMOV_L:
    gauge: 0.5 mm2
    length: 0.10 m
    wirecount: 1
    color: BN
  WMOV_N:
    gauge: 0.5 mm2
    length: 0.10 m
    wirecount: 1
    color: BU
  WTF:
    gauge: 1.5 mm2
    length: 0.10 m
    wirecount: 1
    color: BN
  WOUT_L:
    gauge: 1.5 mm2
    length: 0.10 m
    wirecount: 1
    color: BN
  WOUT_N:
    gauge: 1.5 mm2
    length: 0.10 m
    wirecount: 1
    color: BU
  W5V_CARRIER:
    gauge: 0.5 mm2
    length: 0.15 m
    wirecount: 2
    color: GY
    colors: [RD, BK]
  W5V_RELAY:
    gauge: 0.5 mm2
    length: 0.15 m
    wirecount: 2
    color: GY
    colors: [RD, BK]
  WRELAY:
    gauge: 0.25 mm2
    length: 0.15 m
    wirecount: 2
    color: GY
    colors: [WH, GN]
connections:
  - [P1: L, WL: [1], F1: IN]
  - [F1: OUT, WL2: [1], TF1: IN]
  - [F1: OUT, WPSU_L: [1], PS1: AC_L]
  - [F1: OUT, WMOV_L: [1], MOV1: L]
  - [P1: N, WN: [1], K1: COM2]
  - [P1: N, WPSU_N: [1], PS1: AC_N]
  - [P1: N, WMOV_N: [1], MOV1: N]
  - [TF1: OUT, WTF: [1], K1: COM1]
  - [K1: NO1, WOUT_L: [1], X1: L]
  - [K1: NO2, WOUT_N: [1], X1: N]
  - [P1: PE, WPE: [1], X1: PE]
  - [PS1: [+5V, 0V], W5V_CARRIER: [1, 2], J8: [+5V, GND]]
  - [J3: [+5V, GND], W5V_RELAY: [1, 2], K1: [VCC, GND]]
  - [J3: [RELAY_IN1, RELAY_IN2], WRELAY: [1, 2], K1: [IN1, IN2]]
