metadata:
  title: Smart Plug Main Harness (REV_C, PSU board)
  description: 'Mains input -> REV_C PSU board TB1; PSU board TB2 L/N -> relay -> socket. Fuse/MOV/TCO are on the PSU board. PE is a dedicated chassis stud, not on the PSU board. 5 V outputs J5/J6/J7 feed carrier, relay and PZEM.'
  author: OpenCode - digital engineering
  date: '2026-11-16'
  rev: REV_C_PSU_BOARD
options:
  fontname: Arial
  bgcolor: WH
connectors:
  P1:
    type: Type F plug (mains input, 16 A class)
    pinlabels: [L, N, PE]
  PS1:
    type: REV_C PSU board TB1 (230 VAC input)
    pinlabels: [L, N]
  PS2:
    type: REV_C PSU board TB2 (230 VAC output)
    pinlabels: [L, N]
  K1:
    type: 2-channel 5 V optocoupler relay module (off-board, active-LOW)
    pinlabels: [IN1, IN2, VCC, GND, COM1, NO1, COM2, NO2]
  X1:
    type: Type F socket output (16 A class)
    pinlabels: [L, N, PE]
  PSU_J5:
    type: PSU 5 V OUT1 (carrier)
    pinlabels: [+5V, GND]
  PSU_J6:
    type: PSU 5 V OUT2 (relay)
    pinlabels: [+5V, GND]
  J8:
    type: Carrier 5 V input (JST-XH 2)
    pinlabels: [+5V, GND]
  J3:
    type: Carrier relay connector (JST-XH 4)
    pinlabels: [+5V, GND, RELAY_IN1, RELAY_IN2]
cables:
  WL:
    gauge: 1.5 mm2
    length: 0.20 m
    wirecount: 1
    color: BN
  WN:
    gauge: 1.5 mm2
    length: 0.20 m
    wirecount: 1
    color: BU
  WPE:
    gauge: 1.5 mm2
    length: 0.20 m
    wirecount: 1
    color: GNYE
  WL_OUT:
    gauge: 1.5 mm2
    length: 0.15 m
    wirecount: 1
    color: BN
  WN_OUT:
    gauge: 1.5 mm2
    length: 0.15 m
    wirecount: 1
    color: BU
  WOUT_L:
    gauge: 1.5 mm2
    length: 0.10 m
    wirecount: 1
    color: BN
  WOUT_N:
    gauge: 1.5 mm2
    length: 0.10 m
    wirecount: 1
    color: BU
  W5V_CARRIER:
    gauge: 0.5 mm2
    length: 0.20 m
    wirecount: 2
    color: GY
    colors: [RD, BK]
  W5V_RELAY:
    gauge: 0.5 mm2
    length: 0.20 m
    wirecount: 2
    color: GY
    colors: [RD, BK]
  WRELAY:
    gauge: 0.25 mm2
    length: 0.15 m
    wirecount: 2
    color: GY
    colors: [WH, GN]
connections:
  - [P1: L, WL: [1], PS1: L]
  - [P1: N, WN: [1], PS1: N]
  - [PS2: L, WL_OUT: [1], K1: COM1]
  - [PS2: N, WN_OUT: [1], K1: COM2]
  - [K1: NO1, WOUT_L: [1], X1: L]
  - [K1: NO2, WOUT_N: [1], X1: N]
  - [P1: PE, WPE: [1], X1: PE]
  - [PSU_J5: [+5V, GND], W5V_CARRIER: [1, 2], J8: [+5V, GND]]
  - [PSU_J6: [+5V, GND], W5V_RELAY: [1, 2], K1: [VCC, GND]]
  - [J3: [RELAY_IN1, RELAY_IN2], WRELAY: [1, 2], K1: [IN1, IN2]]
