metadata:
  title: Smart Plug — Main Harness (REV_A_PROVISIONAL)
  description: 'Diagram harness sistem. Garis mains hanya untuk review engineer; bukan
    instruksi energisasi untuk pemula. PE tidak boleh diputus. Semua konektor, warna,
    dan panjang harus diverifikasi terhadap MPN final.

    '
  author: OpenCode — digital engineering
  date: '2026-11-15'
  rev: REV_A_PROVISIONAL
options:
  fontname: Arial
  bgcolor: WH
connectors:
  P1:
    type: Type F plug (mains input, 16 A class TBD)
    pinlabels:
    - L
    - N
    - PE
    notes: MPN belum disetujui. PE kontinu.
  F1:
    type: Fuse holder + 10 A time-lag fuse
    pinlabels:
    - IN
    - OUT
  MOV1:
    type: MOV 275 VAC
    pinlabels:
    - L
    - N
  TF1:
    type: Thermal cutoff 99 C one-shot
    pinlabels:
    - IN
    - OUT
  K1:
    type: 2-channel 5V optocoupler relay module (off-board, active-LOW assumed)
    pinlabels:
    - IN1
    - IN2
    - VCC
    - GND
    - COM1
    - NO1
    - COM2
    - NO2
    notes: 'Two independent SPDT channels: CH1 switches L, CH2 switches N. NOT a mechanically
      linked DPST. IN1/IN2 are pulled LOW together by the carrier MOSFET; module active-LOW.
      Verify JD-VCC/pinout and rating.'
  X1:
    type: Type F socket output (16 A class TBD)
    pinlabels:
    - L
    - N
    - PE
  PS1:
    type: Hi-Link HLK-5M05 (5 V 1 A, 5 W, 4-pin)
    pinlabels:
    - AC_L
    - AC_N
    - +5V
    - 0V
    notes: 'Pin 1/2 = AC, pin 3 = -Vo, pin 4 = +Vo. Keep AC pins and SELV output separated; fuse/MOV upstream. Datasheet isolation 2500 VAC is a claim; batch/hipot unverified.'
  U2:
    type: PZEM-004T V4 100 A split CT (DOCUMENTATION_DEFICIENT)
    pinlabels:
    - L
    - N
    - CT_P
    - CT_N
    - +5V_ISO
    - GND_ISO
    - TX
    - RX
  CT1:
    type: Split CT connector (around one conductor only)
    pinlabels:
    - CT_P
    - CT_N
  U6:
    type: ADuM1201 UART isolator
    pinlabels:
    - VDD1
    - GND1
    - TX1
    - RX1
    - VDD2
    - GND2
    - TX2
    - RX2
    notes: 'Barrier: side 2 is PZEM isolated; side 1 is SELV.'
  U7:
    type: B0505S-1WR3 isolated DC/DC
    pinlabels:
    - +5V_IN
    - GND_IN
    - +5V_ISO
    - GND_ISO
  J_5V:
    type: SELV 5 V distribution block (not a mains terminal)
    pinlabels:
    - +5V_IN
    - +5V_A
    - +5V_B
    - GND_IN
    - GND_A
    - GND_B
    notes: Distribution only; keyed/color-coded. No mains.
  J_ISO:
    type: Isolated 5 V distribution block (PZEM side)
    pinlabels:
    - +5V_IN
    - +5V_A
    - +5V_B
    - GND_IN
    - GND_A
    - GND_B
    notes: Never connect to SELV GND.
  J1:
    type: Low-voltage carrier connector
    pinlabels:
    - +5V
    - GND
    - +3V3
    - RELAY_IN1
    - RELAY_IN2
    - RELAY_FB
    - PZEM_TX
    - PZEM_RX
    notes: Carrier is SELV only. RELAY_IN1/IN2 are the same MOSFET drain net, exposed
      as two pins for the off-board relay module inputs.
