    wirelabels:
    - PSU_N
    wirecount: 1
  W5V:
    gauge: 0.5 mm2
    length: 0.15 m
    color: GY
    wirelabels:
    - +5V_IN
    - GND_IN
    wirecount: 2
    colors:
    - RD
    - BK
  W5V_CARRIER:
    gauge: 0.5 mm2
    length: 0.15 m
    color: GY
    wirelabels:
    - +5V_A
    - GND_A
    wirecount: 2
    colors:
    - RD
    - BK
  W5V_ISO_IN:
