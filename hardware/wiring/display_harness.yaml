metadata:
  title: Display, RTC, Button and RGB Harness (REV_B)
  description: 'SELV only. Carrier connectors J4 (OLED), J5 (RTC), J6 (button), J7 (RGB). I2C pullups and the 74HCT125 RGB level shift are on the carrier.'
  author: OpenCode
  date: '2026-11-16'
  rev: REV_B_NO_TEMP
options:
  bgcolor: WH
connectors:
  J4:
    type: Carrier OLED connector (JST-XH 4)
    pinlabels: [+3V3, GND, SDA, SCL]
  U4:
    type: OLED SSD1306 0.96 I2C
    pinlabels: [VCC, GND, SDA, SCL]
  J5:
    type: Carrier RTC connector (JST-XH 6)
    pinlabels: [+3V3, GND, SDA, SCL, RTC_INT, NC]
  U5:
    type: DS3231 RTC module
    pinlabels: [VCC, GND, SDA, SCL, INT, 32K]
  J6:
    type: Carrier button connector (JST-XH 2)
    pinlabels: [BUTTON, GND]
  SW1:
    type: Panel pushbutton
    pinlabels: [A, B]
  J7:
    type: Carrier RGB connector (JST-XH 3)
    pinlabels: [+5V, GND, DATA]
  LED1:
    type: WS2812B external RGB
    pinlabels: [VCC, GND, DIN]
cables:
  W_OLED:
    gauge: 0.25 mm2
    length: 0.12 m
    wirecount: 4
    color: GY
    colors: [RD, BK, WH, GN]
  W_RTC:
    gauge: 0.25 mm2
    length: 0.12 m
    wirecount: 5
    color: GY
    colors: [RD, BK, WH, GN, YE]
  W_BTN:
    gauge: 0.25 mm2
    length: 0.12 m
    wirecount: 2
    color: GY
    colors: [OG, BK]
  W_RGB:
    gauge: 0.25 mm2
    length: 0.12 m
    wirecount: 3
    color: GY
    colors: [RD, BK, GN]
connections:
  - [J4: [+3V3, GND, SDA, SCL], W_OLED: [1, 2, 3, 4], U4: [VCC, GND, SDA, SCL]]
  - [J5: [+3V3, GND, SDA, SCL, RTC_INT], W_RTC: [1, 2, 3, 4, 5], U5: [VCC, GND, SDA, SCL, INT]]
  - [J6: [BUTTON, GND], W_BTN: [1, 2], SW1: [A, B]]
  - [J7: [+5V, GND, DATA], W_RGB: [1, 2, 3], LED1: [VCC, GND, DIN]]
