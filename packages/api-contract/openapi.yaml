openapi: 3.1.0
info:
  title: Smart Plug API
  version: 1.0.0
  description: |
    Contract for the ESP32-S3 smart plug backend. All timestamps are UTC ISO-8601.
    A command is not successful merely because it was published: status progresses
    through PENDING -> DELIVERED -> APPLIED, or ends in REJECTED/EXPIRED/TIMEOUT.
    `observed_output` is null unless the device has a verified contact-feedback sensor.
servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://api.example.invalid
    description: Placeholder for staging/production; replace after approval
tags:
  - name: auth
  - name: devices
  - name: telemetry
  - name: automation
  - name: operations
  - name: health
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Rotate access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              additionalProperties: false
              properties:
                refresh_token:
                  type: string
                  minLength: 20
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current refresh session
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me:
    get:
      tags: [auth]
      summary: Current user, homes, and roles
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/devices:
    get:
      tags: [devices]
      summary: List devices visible to the current user
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/device-claims:
    post:
      tags: [devices]
      summary: Claim a device with a single-use pairing code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimDeviceRequest'
      responses:
        '201':
          description: Claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDeviceResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [devices]
      summary: Device detail with freshness and state
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [devices]
      summary: Rename a device or set its room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                room:
                  type: string
                  maxLength: 80
                  nullable: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/time:
    get:
      summary: Server time for client fallback
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Server UTC time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeStatusResponse'

  /api/v1/devices/{deviceId}/time:
    post:
      summary: Manual time set (owner/admin, audited)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualTimeRequest'
      responses:
        "200":
          description: Manual time accepted and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualTimeResponse'
        "403":
          description: Owner/admin role required
        "422":
          description: Invalid UTC or timezone

  /api/v1/devices/{deviceId}/commands:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [devices]
      summary: Request ON or OFF
      description: |
        The API validates ownership, role, TTL, idempotency, and known lockout
        state. A 202 response means the command was accepted for delivery, not
        that the physical output changed. Poll the command endpoint for outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: Command accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DownstreamUnavailable'
  /api/v1/devices/{deviceId}/commands/{commandId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - name: commandId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags: [devices]
      summary: Poll command outcome
      responses:
        '200':
          description: Command status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices/{deviceId}/telemetry:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [telemetry]
      summary: Read raw telemetry samples in a time range
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Samples
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/devices/{deviceId}/analytics:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [telemetry]
      summary: Aggregated energy and estimated cost
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          schema: { type: string, enum: [hour, day, week, month], default: day }
        - name: timezone
          in: query
          schema: { type: string, default: Asia/Jakarta }
      responses:
        '200':
          description: Aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/devices/{deviceId}/automations:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [automation]
      summary: Read schedules
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationsResponse'
    put:
      tags: [automation]
      summary: Replace schedules with optimistic version check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationsRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationsResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/devices/{deviceId}/tariff:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [automation]
      summary: Read tariff history
      responses:
        '200':
          description: Tariffs
          content:
            application/json:
              schema:
                type: object
                required: [device_id, tariffs]
                properties:
                  device_id: { type: string }
                  tariffs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tariff'
    put:
      tags: [automation]
      summary: Add a tariff segment effective from a timestamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/devices/{deviceId}/budget:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [automation]
      summary: Read energy budget
      responses:
        '200':
          description: Budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
    put:
      tags: [automation]
      summary: Set energy budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/devices/{deviceId}/events:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [operations]
      summary: Read fault, command, and audit events
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
  /api/v1/devices/{deviceId}/notifications/test:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [operations]
      summary: Send a test notification through the configured provider
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [notification_id, provider, status]
                properties:
                  notification_id: { type: string }
                  provider: { type: string, enum: [mock, telegram] }
                  status: { type: string, enum: [QUEUED, SENT, FAILED] }
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/devices/{deviceId}/diagnostics:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [operations]
      summary: Engineering diagnostics (owner/admin only)
      responses:
        '200':
          description: Diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostics'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/devices/{deviceId}/ota:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [operations]
      summary: Request an approved firmware update (does not bypass device safety)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release_id]
              additionalProperties: false
              properties:
                release_id: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '202':
          description: Update requested
          content:
            application/json:
              schema:
                type: object
                required: [command_id, status]
                properties:
                  command_id: { type: string }
                  status: { type: string, enum: [PENDING, REJECTED] }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/devices/{deviceId}/revoke:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [operations]
      summary: Revoke ownership and device credentials
      responses:
        '204':
          description: Revoked
        '403':
          $ref: '#/components/responses/Forbidden'
  /health/live:
    get:
      tags: [health]
      security: []
      summary: Liveness probe
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      tags: [health]
      security: []
      summary: Readiness probe
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found or intentionally hidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DownstreamUnavailable:
      description: Broker or downstream service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 200 }
    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, minimum: 1 }
    MeResponse:
      type: object
      required: [user_id, email, display_name, homes]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        homes:
          type: array
          items:
            type: object
            required: [home_id, name, role]
            properties:
              home_id: { type: string }
              name: { type: string }
              role: { type: string, enum: [owner, admin, viewer] }
    DeviceState:
      type: object
      required: [commanded_output, observed_output, lockout, fault_code, state_version, last_transition_at, clock_valid, meter_valid, temperature_valid]
      properties:
        commanded_output: { type: string, enum: [ON, OFF] }
        observed_output: { type: string, enum: [ON, OFF], nullable: true }
        lockout: { type: boolean }
        fault_code: { type: string, nullable: true }
        state_version: { type: integer, minimum: 0 }
        last_transition_at: { type: string, format: date-time }
        clock_valid: { type: boolean }
        meter_valid: { type: boolean }
        temperature_valid: { type: boolean }
        time_valid: { type: boolean }
        time_source: { type: string, enum: [sntp, api, mqtt, manual, none] }
        last_sync: { type: string, format: date-time, nullable: true }
        last_known_time: { type: string, format: date-time, nullable: true }
        time_age_s: { type: integer, minimum: 0, nullable: true }
    TimeStatusResponse:
      type: object
      required: [server_time, timezone, time_valid, time_source, last_sync, time_age_s]
      properties:
        server_time: { type: string, format: date-time }
        timezone: { type: string }
        time_valid: { type: boolean }
        time_source: { type: string, enum: [sntp, api, mqtt, manual, none] }
        last_sync: { type: string, format: date-time, nullable: true }
        time_age_s: { type: integer, minimum: 0, nullable: true }
    ManualTimeRequest:
      type: object
      required: [utc, timezone]
      properties:
        utc: { type: string, format: date-time }
        timezone: { type: string }
    ManualTimeResponse:
      type: object
      required: [device_id, utc, timezone, time_source, accepted_at, mqtt_delivered]
      properties:
        device_id: { type: string }
        utc: { type: string, format: date-time }
        timezone: { type: string }
        time_source: { type: string, enum: [manual] }
        accepted_at: { type: string, format: date-time }
        mqtt_delivered: { type: boolean }
    DeviceSummary:
      type: object
      required: [device_id, name, availability, state, created_at]
      properties:
        device_id: { type: string }
        name: { type: string }
        room: { type: string, nullable: true }
        availability: { type: string, enum: [ONLINE, STALE, OFFLINE, NEVER_SEEN] }
        last_seen_at: { type: string, format: date-time, nullable: true }
        state:
          $ref: '#/components/schemas/DeviceState'
        firmware_version: { type: string, nullable: true }
        data_source: { type: string, enum: [DEVICE, SIMULATOR, SYNTHETIC_DEMO, UNKNOWN] }
        created_at: { type: string, format: date-time }
    DeviceDetail:
      allOf:
        - $ref: '#/components/schemas/DeviceSummary'
        - type: object
          required: [home_id, role]
          properties:
            home_id: { type: string }
            hardware_revision: { type: string, nullable: true }
            role: { type: string, enum: [owner, admin, viewer] }
    ClaimDeviceRequest:
      type: object
      required: [pairing_code]
      additionalProperties: false
      properties:
        pairing_code: { type: string, pattern: '^[0-9]{6,10}$' }
        device_name: { type: string, minLength: 1, maxLength: 80 }
    ClaimDeviceResponse:
      type: object
      required: [device_id, home_id, claimed_at]
      properties:
        device_id: { type: string }
        home_id: { type: string }
        claimed_at: { type: string, format: date-time }
    CommandRequest:
      type: object
      required: [requested_output, idempotency_key]
      additionalProperties: false
      properties:
        requested_output: { type: string, enum: [ON, OFF] }
        idempotency_key: { type: string, minLength: 8, maxLength: 128 }
        ttl_seconds: { type: integer, minimum: 5, maximum: 300, default: 30 }
        reason: { type: string, maxLength: 200 }
    CommandResponse:
      type: object
      required: [command_id, device_id, requested_output, status, accepted_at, expires_at, state_version, observed_output, message, idempotent_replay]
      properties:
        command_id: { type: string }
        device_id: { type: string }
        requested_output: { type: string, enum: [ON, OFF] }
        status: { type: string, enum: [PENDING, ACCEPTED, DELIVERED, APPLIED, REJECTED, EXPIRED, TIMEOUT] }
        accepted_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        state_version: { type: integer, minimum: 0 }
        observed_output: { type: string, enum: [ON, OFF], nullable: true }
        message: { type: string, maxLength: 300 }
        idempotent_replay: { type: boolean }
    TelemetrySample:
      type: object
      required: [sample_id, device_id, sequence, sampled_at, received_at, quality, state]
      properties:
        sample_id: { type: string }
        device_id: { type: string }
        sequence: { type: integer, minimum: 0 }
        sampled_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        quality: { type: string, enum: [VALID, STALE, INVALID] }
        voltage_v: { type: number, nullable: true }
        current_a: { type: number, nullable: true }
        active_power_w: { type: number, nullable: true }
        energy_kwh_total: { type: number, nullable: true }
        power_factor: { type: number, nullable: true }
        frequency_hz: { type: number, nullable: true }
        state:
          $ref: '#/components/schemas/DeviceState'
    TelemetryListResponse:
      type: object
      required: [device_id, samples, next_cursor, data_available]
      properties:
        device_id: { type: string }
        samples:
          type: array
          items:
            $ref: '#/components/schemas/TelemetrySample'
        next_cursor: { type: string, nullable: true }
        data_available: { type: boolean }
    AnalyticsBucket:
      type: object
      required: [period_start, period_end, label, energy_kwh, cost_idr, sample_count, gap_count, data_available]
      properties:
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        label: { type: string }
        energy_kwh: { type: number, nullable: true }
        cost_idr: { type: number, nullable: true }
        sample_count: { type: integer, minimum: 0 }
        gap_count: { type: integer, minimum: 0 }
        data_available: { type: boolean }
    AnalyticsResponse:
      type: object
      required: [device_id, from, to, granularity, time_zone, data_available, total_energy_kwh, total_cost_idr, missing_tariff_buckets, buckets]
      properties:
        device_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        granularity: { type: string, enum: [hour, day, week, month] }
        time_zone: { type: string }
        data_available: { type: boolean }
        total_energy_kwh: { type: number, nullable: true }
        total_cost_idr: { type: number, nullable: true }
        missing_tariff_buckets: { type: integer, minimum: 0 }
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsBucket'
    Tariff:
      type: object
      required: [tariff_id, currency, idr_per_kwh, effective_from, effective_to, created_at]
      properties:
        tariff_id: { type: string }
        currency: { type: string, enum: [IDR] }
        idr_per_kwh: { type: number, minimum: 0 }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    TariffRequest:
      type: object
      required: [idr_per_kwh, effective_from]
      additionalProperties: false
      properties:
        idr_per_kwh: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        effective_from: { type: string, format: date-time }
    Budget:
      type: object
      required: [budget_id, period, kwh_limit, idr_limit, enabled, updated_at]
      properties:
        budget_id: { type: string }
        period: { type: string, enum: [daily, weekly, monthly] }
        kwh_limit: { type: number, nullable: true }
        idr_limit: { type: number, nullable: true }
        enabled: { type: boolean }
        updated_at: { type: string, format: date-time }
    BudgetRequest:
      type: object
      required: [period, enabled]
      additionalProperties: false
      properties:
        period: { type: string, enum: [daily, weekly, monthly] }
        kwh_limit: { type: number, nullable: true }
        idr_limit: { type: number, nullable: true }
        enabled: { type: boolean }
    Schedule:
      type: object
      required: [schedule_id, days, start_time, duration_minutes, action, time_zone, enabled]
      properties:
        schedule_id: { type: string }
        days:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 0, maximum: 6 }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        action: { type: string, enum: [ON, OFF] }
        time_zone: { type: string }
        enabled: { type: boolean }
    AutomationsResponse:
      type: object
      required: [device_id, schedules, version]
      properties:
        device_id: { type: string }
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
        version: { type: integer, minimum: 0 }
    AutomationsRequest:
      type: object
      required: [schedules, version]
      additionalProperties: false
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
        version: { type: integer, minimum: 0 }
    EventItem:
      type: object
      required: [event_id, device_id, type, severity, occurred_at, actor_id, source, correlation_id, summary, payload]
      properties:
        event_id: { type: string }
        device_id: { type: string }
        type: { type: string }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: string, nullable: true }
        source: { type: string }
        correlation_id: { type: string, nullable: true }
        summary: { type: string }
        payload: { type: object, additionalProperties: true }
    EventsResponse:
      type: object
      required: [device_id, events, next_cursor]
      properties:
        device_id: { type: string }
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventItem'
        next_cursor: { type: string, nullable: true }
    Diagnostics:
      type: object
      required: [device_id, firmware_version, build_sha, uptime_seconds, rssi_dbm, heap_free_bytes, last_error, sensor_health, wifi_state, command_counts, checked_at]
      properties:
        device_id: { type: string }
        firmware_version: { type: string, nullable: true }
        build_sha: { type: string, nullable: true }
        uptime_seconds: { type: integer, nullable: true }
        rssi_dbm: { type: integer, nullable: true }
        heap_free_bytes: { type: integer, nullable: true }
        last_error: { type: string, nullable: true }
        sensor_health:
          type: object
          properties:
            meter: { type: string, enum: [OK, STALE, INVALID, UNKNOWN] }
            temperature: { type: string, enum: [OK, STALE, INVALID, UNKNOWN] }
            relay_feedback: { type: string, enum: [OK, NOT_INSTALLED, MISMATCH, UNKNOWN] }
        wifi_state: { type: string, enum: [CONNECTED, DISCONNECTED, PROVISIONING, UNKNOWN] }
        command_counts:
          type: object
          properties:
            accepted: { type: integer }
            rejected: { type: integer }
            expired: { type: integer }
        checked_at: { type: string, format: date-time }
    Health:
      type: object
      required: [status, service, version, uptime_seconds, checks]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        service: { type: string }
        version: { type: string }
        uptime_seconds: { type: number }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, degraded, down, not_configured] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            request_id: { type: string }
